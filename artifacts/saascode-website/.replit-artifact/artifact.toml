kind = "web"
previewPath = "/"
title = "Saascode IT Solutions"
version = "1.0.0"
id = "artifacts/saascode-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22944

[services.development]
run = "pnpm --filter @workspace/saascode-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saascode-website", "run", "build" ]
publicDir = "artifacts/saascode-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22944"
BASE_PATH = "/"
